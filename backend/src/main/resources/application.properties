spring.application.name=backend

# ─────────────────────────────────────────────────────────────
#  값은 .env 로 주입한다. 여기에 실제 값을 적지 않는다.
#  ${VAR:기본값} — 환경변수가 없으면 기본값(개발용)으로 뜬다.
#
#  .env 를 셸에 올리는 법:
#      set -a; source ../.env; set +a
# ─────────────────────────────────────────────────────────────

# DB — 종류가 아직 안 정해졌다. 기본값은 부팅용 H2 인메모리다 (ADR 대상)
spring.datasource.url=${DB_URL:jdbc:h2:mem:cbam;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# 메일 발송 (17번 리마인드 · 50번 피드백 발송)
spring.mail.host=${MAIL_SMTP_HOST:}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}

# 메일 수신(18번)과 AI 호출(23번·42번)은 스프링 표준 설정이 없다.
# 방식이 정해지면 ADR 을 쓰고 여기에 붙인다.
