spring:
  application:
    name: backend
  profiles:
    default: dev

# ─────────────────────────────────────────────────────────────
#  값은 .env 로 주입한다. 여기에 실제 값을 적지 않는다.
#  ${VAR:기본값} — 환경변수가 없으면 기본값(개발용)으로 뜬다.
#
#  .env 를 셸에 올리는 법:
#      set -a; source ../.env; set +a
# ─────────────────────────────────────────────────────────────

  # 메일 발송 (17번 리마인드 · 50번 피드백 발송)
  mail:
    host: "${MAIL_SMTP_HOST:}"
    port: "${MAIL_SMTP_PORT:587}"
    username: "${MAIL_SMTP_USERNAME:}"
    password: "${MAIL_SMTP_PASSWORD:}"

# ─────────────────────────────────────────────────────────────
#  AI 호출 (22~25번 항목 추출 · 42~45번 초안 작성) — ADR-0012
#
#  ⚠️ api-key 가 비어 있어도 앱은 뜬다. 그때는 AI 를 부르지 않고
#     요구사항 46번의 기본 템플릿으로 간다 — dev 와 테스트가
#     키 없이 돌아야 하기 때문이다.
#
#  ⚠️ 이 키는 백엔드만 쓴다. 프런트에 두지 않는다 —
#     VITE_ 로 시작하는 값은 번들에 박혀 브라우저에서 보인다.
#
#  model 은 구조화 출력(json_schema · strict)을 지원해야 한다.
#  기본값 gpt-4.1-mini 는 실제로 호출해 고른 것이다 — 같은 자료로
#  비교했을 때 「값이 없다(R2)」와 「단위를 몰라 못 옮겼다(R5)」를
#  정확히 갈랐다. 바꾸려면 docs/product/prompts/ 의 사례로 먼저 확인한다.
# ─────────────────────────────────────────────────────────────
cbam:
  ai:
    base-url: "${AI_BASE_URL:https://api.openai.com/v1}"
    api-key: "${AI_API_KEY:}"
    model: "${AI_MODEL:gpt-4.1-mini}"
    timeout: "${AI_TIMEOUT:60s}"

# DB는 프로필별 설정을 사용한다 (ADR-0010-postgresql).
# - dev: application-dev.yml (PostgreSQL, 개발용 샘플 데이터는 Docker 초기화 시 입력)
# - prod: application-prod.yml (PostgreSQL, 스키마만 Docker 초기화 시 생성)
# 메일 수신(18번)은 아직 스프링 표준 설정이 없다.
# 방식이 정해지면 ADR 을 쓰고 여기에 붙인다.
# AI 호출(23번·42번)은 위 cbam.ai 로 정해졌다 — ADR-0012.
