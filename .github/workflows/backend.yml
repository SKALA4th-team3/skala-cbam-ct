# BE 검사. FE 워크플로와 같은 이유로 만든다 — 손으로 돌려야 하는 검사는 사흘 뒤에 아무도 돌리지 않는다.
#
# ⚠️ 이게 없어서 실제로 일이 났다. `dev` 가 스프링 컨텍스트조차 못 띄우는 상태로 머지돼 있었는데
#    (같은 이름의 엔티티·레포지터리가 두 도메인에 생겨 BeanDefinitionOverrideException)
#    FE 워크플로만 돌고 있어 아무도 몰랐다. 그 뒤로 올라간 PR 은 전부 깨진 base 위에 있었다.
#
# 무엇을 보나
#   test  — `./gradlew test`. 스프링 컨텍스트가 뜨는지가 여기서 먼저 걸린다
#           PostgreSqlListApiTest 는 Testcontainers 로 진짜 PostgreSQL 을 띄운다.
#           GitHub 러너에는 Docker 가 있어서 이 검사가 CI 에서는 실제로 돈다
#           (개발자 노트북에 Docker 가 없으면 그 1건만 실패한다 — 그건 환경 문제다)
#   build — 실행 가능한 jar 로 묶이는지
name: backend

on:
  pull_request:
    branches: [dev, main]
    # docs/product/prompts 도 본다 — Gradle 이 그 폴더의 AI 스키마·시스템 프롬프트를
    # 백엔드 리소스로 복사한다(ADR-0013 ⑤). 거기가 깨지면 BE 빌드가 깨진다
    paths: ['backend/**', 'docs/product/prompts/**', '.github/workflows/backend.yml']
  push:
    branches: [dev]
    paths: ['backend/**', 'docs/product/prompts/**', '.github/workflows/backend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # AI_API_KEY 를 주지 않는다 — AiClientLiveTest 는 통째로 건너뛴다.
      # 키를 CI 시크릿에 넣으면 PR 마다 실제 요금이 나가고, 외부 서비스가 죽으면
      # 우리 CI 가 빨개진다. 그 검사는 사람이 키를 들고 돌린다.
      # 프로필(test → H2)은 build.gradle 의 test 태스크가 이미 지정한다
      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 빌드
        run: ./gradlew bootJar --no-daemon

      - name: 테스트 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
